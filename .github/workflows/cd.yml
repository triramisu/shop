name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: docker.io/t1r4m15u/shop

jobs:
  publish-image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - name: Resolve immutable image tag
        id: image
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          image="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" \
            | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build application image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE" \
            .

      - name: Reject vulnerable runtime image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image \
            --timeout 10m \
            --scanners vuln \
            --pkg-types os \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            "$IMAGE"

      - name: Push immutable application image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"

          digest="$(docker buildx imagetools inspect \
            "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Log out from Docker Hub
        if: always()
        run: docker logout docker.io || true

  deploy-production:
    if: >-
      needs.publish-image.result == 'success' &&
      vars.DEPLOY_ENABLED == 'true'
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    concurrency:
      group: shop-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Validate deployment variables
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$AWS_ACCOUNT_ID"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$AWS_REGION"
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: shop-${{ github.run_id }}

      - name: Deploy immutable image through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
        run: |
          set -euo pipefail

          jq -n --arg image "$IMAGE" '{
            commands: [
              "set -eu",
              "cd /opt/shop",
              ("./deploy.sh " + ($image | @sh))
            ]
          }' > ssm-parameters.json

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE}" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 600 \
            --query 'Command.CommandId' \
            --output text)"

          status="Pending"
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo Pending)"
            case "$status" in
              Success|Cancelled|Failed|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unexpected Systems Manager command status: $status" >&2
                exit 1
                ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          if [[ "$status" != "Success" ]]; then
            exit 1
          fi
