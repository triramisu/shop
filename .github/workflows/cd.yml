name: CD

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan only, apply image, or verify the existing fleet
        type: choice
        options: [plan, apply, verify]
        default: plan
      image:
        description: Pinned Shop image; required for verify. Empty plan/apply builds verified main.
        type: string
        required: false
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  IMAGE_REPOSITORY: docker.io/t1r4m15u/shop

jobs:
  verified-source:
    if: >-
      github.repository == 'triramisu/shop' &&
      vars.ASG_CD_ENABLED == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
         vars.ASG_AUTO_DEPLOY_ENABLED == 'true' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Validate manual request
        if: github.event_name == 'workflow_dispatch'
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          node -e 'const m=process.env.OPERATION; if(!["plan","apply","verify"].includes(m))throw Error("INVALID_OPERATION"); if(m==="verify"||process.env.REQUESTED_IMAGE)require("./ci/asg-release.cjs").imageDigest(process.env.REQUESTED_IMAGE)'
      - name: Require current main and successful main CI
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/cd-source.cjs

  publish-image:
    needs: verified-source
    if: >-
      needs.verified-source.result == 'success' &&
      (github.event_name == 'workflow_run' || (inputs.operation != 'verify' && inputs.image == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}

    steps:
      - name: Resolve immutable image tag
        id: image
        env:
          SOURCE_SHA: ${{ needs.verified-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          image="${IMAGE_REPOSITORY}:sha-${SOURCE_SHA}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verified-source.outputs.source_sha }}
          persist-credentials: false

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"
          printf '%s' "$DOCKERHUB_TOKEN" \
            | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build application image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          SOURCE_SHA: ${{ needs.verified-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE" \
            .

      - name: Reject vulnerable runtime image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image \
            --timeout 10m \
            --scanners vuln \
            --pkg-types os \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            "$IMAGE"

      - name: Push immutable application image
        id: publish
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"

          digest="$(docker buildx imagetools inspect \
            "$IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=${IMAGE_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Log out from Docker Hub
        if: always()
        run: docker logout docker.io || true

  deploy-production:
    if: >-
      always() &&
      needs.verified-source.result == 'success' &&
      vars.ASG_CD_ENABLED == 'true' &&
      (needs.publish-image.result == 'success' ||
       (needs.publish-image.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.image != ''))
    needs: [verified-source, publish-image]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: production
    concurrency:
      group: shop-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read

    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      CFN_STACK_NAME: ${{ vars.CFN_STACK_NAME }}
      DEPLOY_IMAGE: ${{ needs.publish-image.outputs.image || inputs.image }}
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'apply' }}
      SOURCE_SHA: ${{ needs.verified-source.outputs.source_sha }}
      RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verified-source.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Require AWS CLI validation support
        run: aws cloudformation describe-events --generate-cli-skeleton input > /dev/null
      - name: Validate deployment variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$AWS_DEPLOY_ROLE_ARN" == 'arn:aws:iam::233377400170:role/shop-backend-github-deploy' ]]
          node -e 'require("./ci/asg-release.cjs").validateOptions({accountId:process.env.AWS_ACCOUNT_ID,region:process.env.AWS_REGION,stackName:process.env.CFN_STACK_NAME,image:process.env.DEPLOY_IMAGE,mode:process.env.DEPLOY_MODE,sourceSha:process.env.SOURCE_SHA,releaseId:process.env.RELEASE_ID})'

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: shop-${{ github.run_id }}
          role-duration-seconds: 5400

      - name: Recheck source freshness before AWS release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ci/cd-source.cjs --fresh-only

      - name: Image-only CloudFormation release and whole-fleet verification
        run: node ci/asg-release.cjs

      - name: Preserve release plan and previous image
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: asg-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: asg-release-result.json
          if-no-files-found: ignore
          retention-days: 14
