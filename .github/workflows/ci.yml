name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Resolve Maven dependencies
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode dependency:go-offline

      - name: Reject known vulnerabilities
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            fs \
            --scanners vuln \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            /work

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node for deployment regression
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Verify ASG release and trusted-proxy contracts without AWS credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/shop-ci-tools" --ignore-scripts --no-audit --no-fund --no-save js-yaml@4.1.1
          SHOP_YAML_MODULE="$RUNNER_TEMP/shop-ci-tools/node_modules/js-yaml" \
          SHOP_BASH="$(command -v bash)" SHOP_PYTHON="$(command -v python3)" \
          node --test ci/asg-release.test.cjs ci/asg-cli-contract.test.cjs ci/cd-source.test.cjs ci/aws-prod-template.test.cjs \
            ci/aws-vnpay-preflight.test.cjs ci/aws-vnpay-template.test.cjs ci/aws-trusted-proxy.test.cjs

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Verify
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Validate local development Compose
        run: |
          docker compose \
            --env-file .env.example \
            -f compose.yaml --profile app \
            config --quiet
