name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Resolve Maven dependencies
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode dependency:go-offline

      - name: Reject known vulnerabilities
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            fs \
            --scanners vuln \
            --severity MEDIUM,HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            /work

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean verify

      - name: Validate deployment bundle
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/mysql/init/01-create-accounts.sh
          docker compose \
            --env-file deploy/.env.prod.example \
            -f deploy/compose.prod.yml \
            config --quiet
