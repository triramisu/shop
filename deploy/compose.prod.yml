name: shop-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    command: ["mysqld", "--bind-address=0.0.0.0"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_RUNTIME_USERNAME: ${MYSQL_RUNTIME_USERNAME:?MYSQL_RUNTIME_USERNAME is required}
      MYSQL_RUNTIME_PASSWORD: ${MYSQL_RUNTIME_PASSWORD:?MYSQL_RUNTIME_PASSWORD is required}
      MYSQL_MIGRATION_USERNAME: ${MYSQL_MIGRATION_USERNAME:?MYSQL_MIGRATION_USERNAME is required}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?MYSQL_MIGRATION_PASSWORD is required}
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - shop-mysql-data:/var/lib/mysql
      - ./mysql/init/01-create-accounts.sh:/docker-entrypoint-initdb.d/01-create-accounts.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z@sha256:29a498b24669cae1fed11c1a2fb2b3d73c68829a0a9c0b14e71b386671d38fac
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - shop-minio-data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  app:
    image: ${SHOP_IMAGE:?SHOP_IMAGE is required}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_DRIVER: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_RUNTIME_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_RUNTIME_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=UTC
      SPRING_FLYWAY_USERNAME: ${MYSQL_MIGRATION_USERNAME}
      SPRING_FLYWAY_PASSWORD: ${MYSQL_MIGRATION_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?JWT_SIGNER_KEY is required}
      JWT_ISSUER: ${JWT_ISSUER:-shop}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-shop-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CHECKOUT_INVENTORY_LOCATION_CODE: ${CHECKOUT_INVENTORY_LOCATION_CODE:-MAIN}
      PAYMENT_PROVIDER_TYPE: ${PAYMENT_PROVIDER_TYPE:-none}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PREVIOUS_HASH_SECRETS: ${VNPAY_PREVIOUS_HASH_SECRETS:-}
      VNPAY_PUBLIC_BASE_URL: ${VNPAY_PUBLIC_BASE_URL:-}
      VNPAY_ALLOWED_HOSTS: ${VNPAY_ALLOWED_HOSTS:-}
      VNPAY_CHECKOUT_TTL: ${VNPAY_CHECKOUT_TTL:-10m}
      VNPAY_BANK_CODE: ${VNPAY_BANK_CODE:-}
      VNPAY_QUERY_ENABLED: ${VNPAY_QUERY_ENABLED:-false}
      VNPAY_QUERY_SERVER_IP: ${VNPAY_QUERY_SERVER_IP:-}
      VNPAY_QUERY_CONNECT_TIMEOUT: ${VNPAY_QUERY_CONNECT_TIMEOUT:-2s}
      VNPAY_QUERY_READ_TIMEOUT: ${VNPAY_QUERY_READ_TIMEOUT:-3s}
      VNPAY_QUERY_CALL_TIMEOUT: ${VNPAY_QUERY_CALL_TIMEOUT:-5s}
      PAYMENT_RECONCILIATION_ENABLED: ${PAYMENT_RECONCILIATION_ENABLED:-false}
      PAYMENT_RECONCILIATION_BATCH_SIZE: ${PAYMENT_RECONCILIATION_BATCH_SIZE:-10}
      PAYMENT_RECONCILIATION_MAX_ATTEMPTS: ${PAYMENT_RECONCILIATION_MAX_ATTEMPTS:-12}
      PAYMENT_RECONCILIATION_MINIMUM_AGE: ${PAYMENT_RECONCILIATION_MINIMUM_AGE:-10m}
      PAYMENT_RECONCILIATION_MAXIMUM_AGE: ${PAYMENT_RECONCILIATION_MAXIMUM_AGE:-24h}
      PAYMENT_RECONCILIATION_LEASE_DURATION: ${PAYMENT_RECONCILIATION_LEASE_DURATION:-30s}
      PAYMENT_RECONCILIATION_PROVIDER_INTERVAL: ${PAYMENT_RECONCILIATION_PROVIDER_INTERVAL:-5s}
      PAYMENT_RECONCILIATION_RETRY_BASE: ${PAYMENT_RECONCILIATION_RETRY_BASE:-1m}
      PAYMENT_RECONCILIATION_RETRY_MAX: ${PAYMENT_RECONCILIATION_RETRY_MAX:-30m}
      PAYMENT_RECONCILIATION_FIXED_DELAY: ${PAYMENT_RECONCILIATION_FIXED_DELAY:-10s}
      PAYMENT_RECONCILIATION_INITIAL_DELAY: ${PAYMENT_RECONCILIATION_INITIAL_DELAY:-30s}
      PAYMENT_REFUND_ENABLED: ${PAYMENT_REFUND_ENABLED:-false}
      OPENAPI_ENABLED: ${OPENAPI_ENABLED:-false}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
      OBJECT_STORAGE_TYPE: minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-shop-product-images}
      MINIO_AUTO_CREATE_BUCKET: ${MINIO_AUTO_CREATE_BUCKET:-true}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  shop-mysql-data:
  shop-minio-data:
