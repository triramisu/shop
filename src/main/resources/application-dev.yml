spring:
  config:
    activate:
      on-profile: dev
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:shop}
    password: ${SPRING_DATASOURCE_PASSWORD:shop-local-password}

app:
  payment:
    provider:
      type: ${PAYMENT_PROVIDER_TYPE:fake}
    stripe:
      success-url: ${STRIPE_SUCCESS_URL:http://localhost:8080/api/payments/checkout/return}
      cancel-url: ${STRIPE_CANCEL_URL:http://localhost:8080/api/payments/checkout/cancel}
      allowed-return-hosts: ${STRIPE_ALLOWED_RETURN_HOSTS:localhost,127.0.0.1}
      webhook-secrets: ${STRIPE_WEBHOOK_SECRETS:}
  catalog:
    images:
      storage:
        type: ${OBJECT_STORAGE_TYPE:minio}
        minio:
          endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
          access-key: ${MINIO_ACCESS_KEY:shop-local-access}
          secret-key: ${MINIO_SECRET_KEY:shop-local-secret-change-me}
          bucket: ${MINIO_BUCKET:shop-product-images}
          auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
          presigned-url-ttl: ${MINIO_PRESIGNED_URL_TTL:15m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  signerKey: ${JWT_SIGNER_KEY:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}
