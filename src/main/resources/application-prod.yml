spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    url: ${SPRING_FLYWAY_URL}
    user: ${SPRING_FLYWAY_USERNAME}
    password: ${SPRING_FLYWAY_PASSWORD}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

jwt:
  signerKey: ${JWT_SIGNER_KEY}

app:
  payment:
    provider:
      type: ${PAYMENT_PROVIDER_TYPE:none}
  catalog:
    images:
      storage:
        type: ${OBJECT_STORAGE_TYPE:minio}
        minio:
          endpoint: ${MINIO_ENDPOINT}
          access-key: ${MINIO_ACCESS_KEY}
          secret-key: ${MINIO_SECRET_KEY}
          bucket: ${MINIO_BUCKET}
          auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:false}
          presigned-url-ttl: ${MINIO_PRESIGNED_URL_TTL:15m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
