spring:
  application:
    name: shop
  messages:
    basename: message
    encoding: UTF-8
  datasource:
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/mysql}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: ${CATALOG_IMAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${CATALOG_IMAGE_MAX_REQUEST_SIZE:30MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

app:
  catalog:
    search:
      strategy: ${CATALOG_SEARCH_STRATEGY:mysql-fulltext}
    images:
      max-files-per-upload: ${CATALOG_IMAGE_MAX_FILES_PER_UPLOAD:5}
      max-files-per-product: ${CATALOG_IMAGE_MAX_FILES_PER_PRODUCT:10}
      max-file-size: ${CATALOG_IMAGE_MAX_FILE_SIZE:5MB}
      max-pixels: ${CATALOG_IMAGE_MAX_PIXELS:40000000}
      storage:
        type: ${OBJECT_STORAGE_TYPE:filesystem}
        filesystem-root: ${OBJECT_STORAGE_ROOT:./data/object-storage}
        minio:
          endpoint: ${MINIO_ENDPOINT:}
          access-key: ${MINIO_ACCESS_KEY:}
          secret-key: ${MINIO_SECRET_KEY:}
          bucket: ${MINIO_BUCKET:shop-product-images}
          auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:false}
          presigned-url-ttl: ${MINIO_PRESIGNED_URL_TTL:15m}
  identity:
    admin:
      bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
      username: ${ADMIN_USERNAME:}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
  open-api:
    info:
      title: ${OPENAPI_TITLE:Shop API}
      version: ${OPENAPI_VERSION:v1}
      description: ${OPENAPI_DESCRIPTION:REST API cho hệ thống Shop dạng modular monolith}
      contact:
        name: ${OPENAPI_CONTACT_NAME:Nhóm phát triển Shop}
        url: ${OPENAPI_CONTACT_URL:}
        email: ${OPENAPI_CONTACT_EMAIL:}
    server:
      url: ${OPENAPI_SERVER_URL:/}
      description: ${OPENAPI_SERVER_DESCRIPTION:Môi trường hiện tại}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      max-buckets: ${AUTH_RATE_LIMIT_MAX_BUCKETS:10000}
      bucket-idle-time: ${AUTH_RATE_LIMIT_BUCKET_IDLE_TIME:10m}
      cleanup-interval: ${AUTH_RATE_LIMIT_CLEANUP_INTERVAL:60000}
      registration:
        capacity: ${AUTH_RATE_LIMIT_REGISTRATION_CAPACITY:5}
        refill-period: ${AUTH_RATE_LIMIT_REGISTRATION_REFILL:1m}
      login:
        capacity: ${AUTH_RATE_LIMIT_LOGIN_CAPACITY:10}
        refill-period: ${AUTH_RATE_LIMIT_LOGIN_REFILL:1m}
      captcha:
        capacity: ${AUTH_RATE_LIMIT_CAPTCHA_CAPACITY:10}
        refill-period: ${AUTH_RATE_LIMIT_CAPTCHA_REFILL:1m}
      introspection:
        capacity: ${AUTH_RATE_LIMIT_INTROSPECTION_CAPACITY:60}
        refill-period: ${AUTH_RATE_LIMIT_INTROSPECTION_REFILL:1m}
      refresh:
        capacity: ${AUTH_RATE_LIMIT_REFRESH_CAPACITY:30}
        refill-period: ${AUTH_RATE_LIMIT_REFRESH_REFILL:1m}
      logout:
        capacity: ${AUTH_RATE_LIMIT_LOGOUT_CAPACITY:30}
        refill-period: ${AUTH_RATE_LIMIT_LOGOUT_REFILL:1m}
    captcha:
      enabled: ${AUTH_CAPTCHA_ENABLED:true}
      failure-threshold: ${AUTH_CAPTCHA_FAILURE_THRESHOLD:3}
      failure-window: ${AUTH_CAPTCHA_FAILURE_WINDOW:15m}
      challenge-ttl: ${AUTH_CAPTCHA_CHALLENGE_TTL:2m}
      max-active-challenges: ${AUTH_CAPTCHA_MAX_ACTIVE_CHALLENGES:10000}
      cleanup-interval: ${AUTH_CAPTCHA_CLEANUP_INTERVAL:60000}
      cleanup-initial-delay: ${AUTH_CAPTCHA_CLEANUP_INITIAL_DELAY:60000}

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 3600 # in seconds
  refreshable-duration: 36000 # in seconds
  cleanup-interval: 3600000 # in milliseconds
  cleanup-initial-delay: 3600000 # in milliseconds
  issuer: ${JWT_ISSUER:shop}
  audience: ${JWT_AUDIENCE:shop-api}
