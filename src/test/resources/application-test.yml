spring:
  datasource:
    url: jdbc:h2:mem:shop;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/h2

jwt:
  signerKey: test-only-hs512-key-with-at-least-sixty-four-bytes-0123456789-abcdefghijk
  valid-duration: 3600
  refreshable-duration: 36000
  cleanup-interval: 3600000
  cleanup-initial-delay: 3600000
  issuer: shop-test
  audience: shop-api-test

app:
  payment:
    provider:
      type: fake
    fake:
      default-mode: success
  order:
    payment:
      auto-initiation-enabled: false
      event-consumption-enabled: false
      recovery:
        enabled: false
    checkout:
      inventory:
        reconciliation:
          enabled: false
  inventory:
    reservation:
      expiration:
        enabled: false
  catalog:
    search:
      strategy: like
    images:
      storage:
        type: memory
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  security:
    rate-limit:
      enabled: false
    captcha:
      enabled: false
